name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax-check scripts
        run: for f in js/*.js; do node --check "$f"; done
      - name: Check local asset references resolve
        run: |
          for ref in $(grep -ohE '(src|href)="[^"#:]+"' index.html | cut -d'"' -f2) \
                     $(grep -ohE "url\('[^':]+'\)" css/*.css | sed -E "s/url\('\.\.\/(.*)'\)/\1/"); do
            test -e "$ref" || { echo "missing: $ref"; exit 1; }
          done
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - name: Package site
        if: github.event_name != 'pull_request'
        run: mkdir _site && cp -r index.html css js assets _site/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
